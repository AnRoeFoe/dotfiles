# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

font_family      family="FiraCode Nerd Font Mono"
font_size        14.0
bold_font        auto
italic_font      auto
bold_italic_font auto

background_opacity 0.9

hide_window_decorations yes

window_padding_width 5

# show tab bar at the top
tab_bar_edge top
# always show tab bar
tab_bar_min_tabs 1
# show tab bar centered
tab_bar_align center

